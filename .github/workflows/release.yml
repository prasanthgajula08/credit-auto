name: Build & Publish Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (keeps identical signature across updates)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing! Add it under Repo Settings -> Secrets -> Actions so Android updates match your installed APK signature."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass android -alias androiddebugkey | grep -E "Owner|SHA256"

      - name: Run unit tests & build R8-optimized release APK
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Rename APK for GitHub Release
        run: cp app/build/outputs/apk/release/app-release.apk CreditAuto.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CreditAuto.apk
          generate_release_notes: true
