name: Build & Publish Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore (keeps identical signature across updates)
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Run unit tests & build R8-optimized release APK
        run: ./gradlew testReleaseUnitTest assembleRelease

      - name: Rename APK for GitHub Release
        run: cp app/build/outputs/apk/release/app-release.apk CreditAuto.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: CreditAuto.apk
          generate_release_notes: true
