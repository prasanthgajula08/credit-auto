name: Build & Publish Android Release (Manual Fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing!"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests & build R8-optimized release APK
        run: ./gradlew testReleaseUnitTest assembleRelease --build-cache --parallel

      - name: Rename APK for GitHub Release
        run: cp app/build/outputs/apk/release/app-release.apk CreditAuto.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreditAuto-apk
          path: CreditAuto.apk
